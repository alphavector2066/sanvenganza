<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | WARRIOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030303;
            color: #ccff00;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .login-box {
            background: #0d0d0d;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #222;
            text-align: center;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-top: 0; font-family: sans-serif; letter-spacing: 2px; text-transform: uppercase; }
        input {
            width: 100%; padding: 15px; margin: 20px 0; background: #000;
            border: 1px solid #333; color: #fff; border-radius: 5px;
            box-sizing: border-box; outline: none; font-size: 16px;
            text-align: center; letter-spacing: 2px;
        }
        input:focus { border-color: #00f3ff; }
        button {
            width: 100%; padding: 15px; background: transparent; color: #ccff00;
            border: 1px solid #ccff00; cursor: pointer; font-size: 16px;
            font-weight: bold; border-radius: 5px; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s;
        }
        button:hover { background: #ccff00; color: #000; }
        #error-msg { color: #ff3366; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>WARRIOR V4</h2>
        <p style="color: #999; font-size: 14px;">Bitácora de Entrenamiento Privada</p>
        <input type="password" id="pass" placeholder="CONTRASEÑA" onkeypress="if(event.keyCode===13) unlock()">
        <button onclick="unlock()">INGRESAR</button>
        <div id="error-msg">Contraseña Incorrecta</div>
    </div>

        async function hashString(str) {
            const msgUint8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            return new Uint8Array(hashBuffer);
        }

                }
                
                const decoder = new TextDecoder('utf-8');
                const plainHtml = decoder.decode(decryptedBytes);

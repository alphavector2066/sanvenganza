<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | WARRIOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030303;
            color: #ccff00;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .login-box {
            background: #0d0d0d;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #222;
            text-align: center;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-top: 0; font-family: sans-serif; letter-spacing: 2px; text-transform: uppercase; }
        input {
            width: 100%; padding: 15px; margin: 20px 0; background: #000;
            border: 1px solid #333; color: #fff; border-radius: 5px;
            box-sizing: border-box; outline: none; font-size: 16px;
            text-align: center; letter-spacing: 2px;
        }
        input:focus { border-color: #00f3ff; }
        button {
            width: 100%; padding: 15px; background: transparent; color: #ccff00;
            border: 1px solid #ccff00; cursor: pointer; font-size: 16px;
            font-weight: bold; border-radius: 5px; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s;
        }
        button:hover { background: #ccff00; color: #000; }
        #error-msg { color: #ff3366; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>

        function unlock() {
            const pass = document.getElementById('pass').value;
            if(!pass) return;
            
            try {
                // Decode base64 to bytes
                const rawData = atob(ciphertext);
                const cipherBytes = new Uint8Array(rawData.length);
                for(let i = 0; i < rawData.length; i++) {
                    cipherBytes[i] = rawData.charCodeAt(i);
                }
                
                const decryptedBytes = new Uint8Array(cipherBytes.length);
                for (let i = 0; i < cipherBytes.length; i++) {
                    // Simple XOR with password string
                    decryptedBytes[i] = cipherBytes[i] ^ pass.charCodeAt(i % pass.length);
                }
                
                // Convert utf-8 bytes back to string
                const decoder = new TextDecoder('utf-8', {fatal: true});
                const plainHtml = decoder.decode(decryptedBytes);
                
                // Simple validation to ensure it worked
                if (plainHtml.includes('<html') || plainHtml.includes('<body') || plainHtml.includes('<!DOCTYPE')) {
                    document.open();
                    document.write(plainHtml);
                    document.close();
                } else {
                    showError();
                }
            } catch (e) {
                // Failed decoding (wrong password creates invalid utf-8)
                showError();
            }
        }

        function showError() {
            const err = document.getElementById('error-msg');
            err.style.display = 'block';
            document.getElementById('pass').value = '';
            setTimeout(() => err.style.display = 'none', 3000);
        }
    </script>
